<div class="content" *ngIf="!loading">

  <main class="main">

    <btn-add></btn-add>

    <div class="table">
        <table-transactions [transactionsData]="transactionsList"></table-transactions>

        <paginator
          (pageP)="setPage($event)"
          (perPageP)="setPerPage($event)"
          [length]="dataTransactions.items">
        </paginator>
    </div>

  </main>

</div>
<div class="loading">
    <app-loading [show]="loading"></app-loading>
</div>
