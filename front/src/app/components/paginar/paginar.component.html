<div>
  <mat-paginator 
      [length]="totalItems"
      [pageSize]="itemsPerPage"
      [pageSizeOptions]="opItemsPerPage"
      aria-label="Select page"
      (page)="onPageChange($event)">
  </mat-paginator>
</div>

<div class="botoes-acoes">
  <button id="adiciona" (click)="irParaForms()">
    Inserir transação
  </button>

  <button id="remove" (click)="removerTransacao()">
    Remover transação
  </button>
</div>
